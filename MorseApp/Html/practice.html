<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../CSS/style.css">

<script src="../JS/theme.js"></script>

</head>

<body>


<nav class="navbar navbar-dark bg-dark border-bottom border-secondary">

<div class="container">

<a class="navbar-brand"
href="index.html">

MorseMaster

</a>

<div>

<a class="btn btn-outline-light me-2"
href="index.html">

Converter

</a>

<a class="btn btn-outline-light me-2"
href="learn.html">

Learn

</a>

<a class="btn btn-outline-light me-2"
href="practice.html">

Practice

</a>

<a class="btn btn-outline-light"
href="history.html">

History

</a>


<a class="btn btn-outline-info"
href="about.html">

About

</a>

<button
class="btn btn-warning ms-2"
onclick="toggleTheme()">

🌙 / ☀️

</button>

</div>

</div>

</nav>

<div class="container py-5 practice-container">

    <h1 class="text-center mb-4">
        Morse Practice
    </h1>

    <h2 id="question"></h2>

    <input
    id="answer"
    class="form-control">

    <div class="practice-buttons">

        <button
        class="btn btn-light"
        onclick="addDot()">
        .
        </button>

        <button
        class="btn btn-light"
        onclick="addDash()">
        -
        </button>

        <button
        class="btn btn-danger"
        onclick="clearAnswer()">
        Clear
        </button>

        <button
        class="btn btn-primary"
        onclick="checkAnswer()">
        Submit
        </button>

        <button
        class="btn btn-success"
        onclick="startNewGame()">
        New Game
        </button>

    </div>

    <h3 id="result" class="mt-4"></h3>

    <div class="stats-card">

        <p>
            Score:
            <span id="score">0</span>
        </p>

        <p>
            Accuracy:
            <span id="accuracy">0</span>%
        </p>

        <p>
            Time:
            <span id="timer">60</span>
            sec
        </p>

    </div>

</div>

<script src="../JS/morse.js"></script>
<script src="../JS/practice.js"></script>

</body>
</html>
