<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../CSS/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="../JS/theme.js"></script>

<title>Morse Converter</title>

</head>

<body>


<nav class="navbar navbar-dark bg-dark border-bottom border-secondary">

<div class="container">

<a class="navbar-brand"
href="index.html">

MorseMaster

</a>

<div>

<a class="btn btn-outline-light me-2"
href="index.html">

Converter

</a>

<a class="btn btn-outline-light me-2"
href="learn.html">

Learn

</a>

<a class="btn btn-outline-light me-2"
href="practice.html">

Practice

</a>

<a class="btn btn-outline-light"
href="history.html">

History

</a>


<select
id="language"
class="form-select w-auto d-inline">

<option value="en-US">
English
</option>

<option value="ar-EG">
Arabic
</option>

</select>

<button
class="btn btn-danger"
onclick="startSpeech()">

🎤 Speech

</button>

<button
class="btn btn-danger"
onclick="sendSOS()">

🚨 SOS

</button>

<a class="btn btn-outline-info"
href="about.html">

About

</a>

<button
class="btn btn-warning ms-2"
onclick="toggleTheme()">

🌙 / ☀️

</button>

</div>

</div>

</nav>

<div class="container py-5">

<div class="text-center mb-4">

    <h1 class="display-3">
        MorseMaster
    </h1>

    <p class="text-secondary">
        Convert, Learn and Practice Morse Code
    </p>

</div>

<div class="card bg-dark">

<div class="card-body">

<textarea
id="inputText"
class="form-control mb-3"
rows="5"
placeholder="Enter text"></textarea>

<button class="btn btn-primary"
onclick="textToMorse()">

<i class="fa-solid fa-arrow-right"></i>
Text → Morse

</button>

<button
class="btn btn-success"
onclick="morseToText()">
Morse → Text
</button>

<button
class="btn btn-warning"
onclick="playMorse()">
Play
</button>

<button
class="btn btn-info"
onclick="copyResult()">
Copy
</button>

<textarea
id="outputText"
class="form-control mt-3"
rows="5"
readonly></textarea>

</div>

</div>

<script src="../JS/morse.js"></script>
<script src="../JS/converter.js"></script>

</body>
</html>
